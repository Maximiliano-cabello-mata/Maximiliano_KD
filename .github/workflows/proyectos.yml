name: Proyectos

on:
  schedule:
    - cron: "17 14 * * 1" # lunes 8:17 en la Ciudad de México
  push:
    branches: [main]
    paths:
      - "proyectos.yml"
      - "herramientas/proyectos.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-readme
  cancel-in-progress: false

jobs:
  proyectos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: herramientas/requirements.txt

      - name: Instalar dependencias
        run: pip install -r herramientas/requirements.txt

      - name: Actualizar tabla de proyectos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python herramientas/proyectos.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "La tabla ya estaba al día."
            exit 0
          fi
          git commit -m "Actualiza la tabla de proyectos"
          git pull --rebase origin main
          git push
