name: Galería de renders

on:
  push:
    branches: [main]
    paths:
      - "renders/**"
      - "herramientas/galeria.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-readme
  cancel-in-progress: false

jobs:
  galeria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: herramientas/requirements.txt

      - name: Instalar dependencias
        run: pip install -r herramientas/requirements.txt

      - name: Validar fichas y generar galería
        run: python herramientas/galeria.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md renders
          if git diff --cached --quiet; then
            echo "La galería ya estaba al día."
            exit 0
          fi
          git commit -m "Actualiza la galería de renders"
          git pull --rebase origin main
          git push
