name: Calidad

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: herramientas/requirements.txt

      - name: Instalar dependencias
        run: pip install -r herramientas/requirements.txt

      - name: Pruebas de los scripts
        run: python -m pytest -q herramientas/pruebas

      - name: Revisar fichas de renders
        run: python herramientas/galeria.py --revisar
